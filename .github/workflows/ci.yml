name: CI — Javeroo-Billeterie

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Unit Tests & Next Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests (Vitest)
        run: npm run test

      - name: Build production bundle
        run: npm run build
        env:
          APP_ENV: staging
          NEXT_PUBLIC_APP_URL: https://staging.javeroo.com
          TICKET_SIGNING_SECRET: ci-build-placeholder-secret-key-at-least-32-chars-long
          SESSION_SECRET: ci-build-session-secret-key-at-least-32-chars-long

