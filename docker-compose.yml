services:
  postgres:
    image: postgres:16-alpine
    container_name: javeroo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: javeroo
      POSTGRES_PASSWORD: javeroo_dev_password
      POSTGRES_DB: javeroo_dev
    ports:
      - "5432:5432"
    volumes:
      - javeroo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javeroo -d javeroo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: javeroo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - javeroo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  javeroo_pg_data:
  javeroo_redis_data:

